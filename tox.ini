[tox]
envlist = py313, coverage, codechecks, typechecking

[testenv]
skip_install = true
allowlist_externals =
  pytest
  pytest-cov
commands =
  pytest --cov=packages --cov-report=html

[testenv:coverage]
description = check that coverage is above 90%
skip_install = true
allowlist_externals =
    coverage
commands =
    coverage report --fail-under=85

[testenv:codechecks]
description = check formatting and linting of the entire package
skip_install = true
allowlist_externals =
    ruff
commands =
    ruff check package
    ruff check test

[testenv:typechecking]
description = static type checking of package
skip_install = true
allowlist_externals =
    mypy
commands =
    mypy -p nml.callbacks \
    -p nml.data \
    -p nml.loss \
    -p nml.models \
    -p nml.train \
    -p nml.utils \
    -p nml.config.shards \
    -p nml.tools.train \
    -p nml.tools.utils \
    -p nml.itf.torch \
    -p nml.tools.torch \
    -p nml.rl.buffer
    mypy test
