default_stages: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: check-case-conflict
        name: check-case-conflict
        entry: check-case-conflict
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: check-merge-conflict
        name: check-merge-conflict
        entry: check-merge-conflict
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: end-of-file-fixer
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: fix-byte-order-marker
        name: fix-byte-order-marker
        entry: fix-byte-order-marker
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: trailing-whitespace-fixer
        name: trailing-whitespace-fixer
        entry: trailing-whitespace-fixer
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: ruff-pkg
        name: lint-checking-ruff-package
        entry: ruff check --fix packages
        files: "^(packages)"
        pass_filenames: false
        language: python
        types: [python]
      - id: mypy-pkg-base
        name: type-checking-base
        entry: mypy -p bkd.callbacks -p bkd.data -p bkd.loss -p bkd.models -p bkd.train -p bkd.utils
        files: "^(packages/bkd-base)"
        pass_filenames: false
        language: python
        types: [python]
      - id: mypy-pkg-itf-torch
        name: type-checking-itf-torch
        entry: mypy -p bkd.itf.torch
        files: "^(packages/bkd-itf-torch|packages/bkd-base)"
        pass_filenames: false
        language: python
        types: [python]
      - id: mypy-pkg-tool-torch
        name: type-checking-tools-torch
        entry: mypy -p bkd.tools.torch
        files: "^(packages/bkd-tools-torch|packages/bkd-base|packages/bkd-itf-torch)"
        pass_filenames: false
        language: python
        types: [python]
      - id: mypy-pkg-config
        name: type-checking-config
        entry: mypy -p bkd.config.shards
        files: "^(packages/bkd-config-base|packages/bkd-base)"
        pass_filenames: false
        language: python
        types: [python]
