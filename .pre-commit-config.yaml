default_stages: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: check-case-conflict
        name: check-case-conflict
        entry: check-case-conflict
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: check-merge-conflict
        name: check-merge-conflict
        entry: check-merge-conflict
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: end-of-file-fixer
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: fix-byte-order-marker
        name: fix-byte-order-marker
        entry: fix-byte-order-marker
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: trailing-whitespace-fixer
        name: trailing-whitespace-fixer
        entry: trailing-whitespace-fixer
        files: "^(packages|test|scripts)"
        language: python
        types: [python]
      - id: ruff-commit
        name: lint-checking-ruff-commit
        entry: ruff check --fix
        pass_filenames: true
        language: python
        types: [python]
      - id: ruff-pkg
        name: lint-checking-ruff-package
        entry: ruff check --fix packages
        files: "^(packages)"
        pass_filenames: false
        language: python
        types: [python]
      - id: mypy-commit
        name: type-checking-commit
        entry: mypy
        pass_filenames: true
        language: python
        types: [python]
      - id: mypy-pkg-base
        name: type-checking-base
        entry: mypy -p bkd.base
        files: "^(packages/bkd-base)"
        pass_filenames: false
        language: python
        types: [python]
      - id: mypy-pkg-torch
        name: type-checking-itf-torch
        entry: mypy -p bkd.itf.torch
        files: "^(packages/bkd-itf-torch|packages/bkd-base)"
        pass_filenames: false
        language: python
        types: [python]
