[project]

# Main info
name = "bkd"
version = "0.1.0"

description = "Behavioral Knowledge Diffuser"
readme = "README.md"

authors = [{ name = "Davide Barbieri", email = "davidebarbieri97@gmail.com" }]

# Tags
keywords = ["diffusion", "rl"]

classifiers = ["Programming Language :: Python :: 3.13"]

# Dependencies
requires-python = ">=3.13"
dependencies = [
  "mlflow>=3.5.1",
  "numpy>=2.3.4",
  "pydantic>=2.12.4",
  "rich>=14.2.0",
  "torch>=2.9.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pandas-stubs>=2.3.2.250926",
  "pre-commit>=4.3.0",
  "pre-commit-hooks>=6.0.0",
  "ruff>=0.14.3",
  "scipy-stubs>=1.16.3.0",
  "tox>=4.32.0",
  "types-cachetools>=6.2.0.20251022",
  "types-docker>=7.1.0.20251009",
  "types-paramiko>=4.0.0.20250822",
  "types-protobuf>=6.32.1.20251105",
  "types-pysftp>=0.2.17.20250805",
  "types-pyyaml>=6.0.12.20250915",
  "types-requests>=2.32.4.20250913",
  "types-tensorflow>=2.18.0.20251008",
  "types-tqdm>=4.67.0.20250809",
]
nvim = ["debugpy>=1.8.17", "pynvim>=0.6.0"]

# Tools

[tool.ruff.lint]
select = ["D", "D417", "I", "F401"]
ignore = [
  "D104", # docstring in public module
  "D203", # incorrect-blank-line-before-class
  "D213", # multi-line-summary-second-line
]

[tool.mypy]
strict = true
install_types = true

disallow_untyped_calls = false
