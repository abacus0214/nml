[project]

# Main info
name = "bkd"
version = "0.1.0"

description = "Behavioral Knowledge Diffuser"
readme = "README.md"

authors = [
  {name = "Davide Barbieri", email="davidebarbieri97@gmail.com"}
]

# Tags
keywords = ["diffusion", "rl"]

classifiers = [
  "Programming Language :: Python :: 3.13",
]

# Dependencies
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.14.3",
]
nvim = [
    "debugpy>=1.8.17",
    "pynvim>=0.6.0",
]

# Tools

[tool.ruff.lint]
select = ["D", "D417", "I", "F401"]

[tool.mypy]
strict = true
install_types = true
