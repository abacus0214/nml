[tool.setuptools.packages.find]
where = ["src/"]
include = ["bkd.itf.torch"]

[project]

# Main info
name = "bkd-itf-torch"
version = "0.1.0"

description = "BKD Torch interface"
readme = "README.md"

authors = [{ name = "Davide Barbieri", email = "davidebarbieri97@gmail.com" }]

# Tags
keywords = ["diffusion", "rl"]

classifiers = ["Programming Language :: Python :: 3.13"]

# Repeating settings of pyright and mypy for typechecking
#
[tool.mypy]
namespace_packages = true
strict = true
install_types = true

disallow_untyped_calls = false

files = ["packages/"]
explicit_package_bases = true

mypy_path = ["../bkd-base/src", "src"]

[tool.pyright]
extraPaths = ["../bkd-base/src", "src"]
