[tool.setuptools.packages.find]
where = ["src/"]
include = ["bkd.base"]

[project]

# Main info
name = "bkd-base"
version = "0.1.0"

description = "Behavioral Knowledge Diffuser"
readme = "README.md"

authors = [{ name = "Davide Barbieri", email = "davidebarbieri97@gmail.com" }]

# Tags
keywords = ["diffusion", "rl"]

classifiers = ["Programming Language :: Python :: 3.13"]

# Repeating settings of pyright and mypy for typechecking
[tool.mypy]
namespace_packages = true
strict = true
install_types = true

disallow_untyped_calls = false

files = ["packages/"]
explicit_package_bases = true

mypy_path = ["src", "../bkd-itf-torch/src", "../bkd-tools-torch/src/"]

[tool.pyright]
extraPaths = ["src", "../bkd-itf-torch/src", "../bkd-tools-torch/src/"]
