[tool.setuptools.packages.find]
where = ["src/"]
include = ["nml.itf.torch"]

[project]

# Main info
name = "nml-itf-torch"
version = "0.1.0"

description = "NML Torch interface"
readme = "README.md"

authors = [{ name = "Davide Barbieri", email = "davidebarbieri97@gmail.com" }]

# Tags
keywords = ["interface", "rl", "ml"]

classifiers = ["Programming Language :: Python :: 3.13"]

# Repeating settings of pyright and mypy for typechecking
[tool.mypy]
namespace_packages = true
strict = true
install_types = true

disallow_untyped_calls = false

files = ["packages/"]
explicit_package_bases = true

mypy_path = ["../nml-base/src", "src", "../nml-tools-base/src/"]

[tool.pyright]
extraPaths = ["../nml-base/src", "src", "../nml-tools-base/src/"]
